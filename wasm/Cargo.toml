[package]
name = "tulpar-cekirdek"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1.7"
# Doğrudan kullanılmıyor; tarayıcıda rastgele sayı üretimini (wasm_js) açmak için gerekli.
getrandom = { version = "0.3", features = ["wasm_js"] }
iroh = { version = "1.5.0", default-features = false, features = ["tls-ring"] }
js-sys = "0.3"
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
